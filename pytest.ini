[pytest]
testpaths = tests services/surveillance/tests
# Two packages are named `tests` (root and services/surveillance); importlib mode keeps them apart.
addopts = --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    db: needs Postgres with pgvector (TEST_DATABASE_URL; see tests/db/conftest.py)
    models: needs model weights (torch / sentence-transformers); skipped in CI
